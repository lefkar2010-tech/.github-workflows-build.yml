                  listOf("озн с правилами", "ознакомьтесь с правилами в лаунчере игры")
              )

              val RULES = listOf(
                  listOf("mu", "mute", "20 2.7 ОП"), listOf("osk", "mute", "30 2.1 ОП"), listOf("fl", "mute", "20 2.2 ОП"),
                  listOf("rod", "ban", "7 2.1 ОП"), listOf("qwe", "ban", "31 5.2 ОП"), listOf("zxc", "ban", "31 снят/адм"),
                  listOf("adm", "ban", "3 3.2 ОП"), listOf("dm", "jail", "60 DM"), listOf("db", "jail", "40 DB"),
