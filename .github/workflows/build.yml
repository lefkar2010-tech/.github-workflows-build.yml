          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.view.accessibility.AccessibilityWindowInfo
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class GmService : AccessibilityService() {
              private val hd = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private lateinit var bubbleP: WindowManager.LayoutParams
              private val wins = HashMap<String, View>()
              private var bubble: View? = null
              private var radial: View? = null
              private var base = ""
              private var pend = false
              private var edit: AccessibilityNodeInfo? = null
              private var lastSet = ""
              private val expandTask = Runnable { expand() }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  Core.onChange = { if (wins.containsKey("rep")) openReports() }
                  showBubble()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  wins.keys.toList().forEach { close(it) }
                  radial?.let { wm.removeView(it) }
                  bubble?.let { wm.removeView(it) }
                  Core.onChange = null
                  super.onDestroy()
              }

              // ---------- чтение чата и отправка ----------
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null || e.packageName?.toString() == packageName) return
                  if (e.eventType == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      val s = e.source
                      if (s != null && s.isEditable) {
                          edit = s
                          hd.removeCallbacks(expandTask)
                          hd.postDelayed(expandTask, 600)
                      }
                  }
                  if (!pend) {
                      pend = true
                      hd.postDelayed({ pend = false; scan() }, 300)
                  }
              }

              private fun gameRoot(): AccessibilityNodeInfo? {
                  for (w in windows) {
                      val r = w.root ?: continue
                      if (w.type == AccessibilityWindowInfo.TYPE_APPLICATION && r.packageName?.toString() != packageName) return r
                  }
                  val a = rootInActiveWindow
                  return if (a != null && a.packageName?.toString() != packageName) a else null
              }

              private fun walk(n: AccessibilityNodeInfo?, out: MutableList<
